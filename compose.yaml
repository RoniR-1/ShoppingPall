services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aimo
      POSTGRES_PASSWORD: aimo
      POSTGRES_DB: aimo
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["aimo-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aimo"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  aimo-data:
